name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow reads code and reports a status. It has no
# reason to write anything, and reeve must never be able to edit the gate that
# judges it.
permissions:
  contents: read

# One run per ref at a time, and a superseded one is stopped rather than raced.
#
# A review round can push five times in an hour, and without this all five runs
# continue to completion. That is not only waste: reeve reads check CONCLUSIONS,
# so four stale runs finish against revisions nobody is judging any more, and the
# reconciler has to work out which of them describes the head under judgement.
# Stopping them removes the ambiguity at the source.
#
# Safe here specifically because reeve already treats a cancelled check as
# UNINFORMATIVE rather than failing — `src/github/reconciler.mjs` calls it
# superseded, not failed, and that distinction was written for exactly this.
#
# NEVER on main. A push to the default branch is history, and its run is the
# evidence R-04 reads for base health; cancelling one because the next commit
# arrived would leave a gap that reads as a commit nobody ever tested.
#
# `cancel-in-progress: false` DOES NOT ACHIEVE THAT ON ITS OWN, which is the
# whole reason main gets its own group per commit. GitHub's documentation is
# explicit: "any existing pending job or workflow in the same concurrency group
# will be canceled", and cancel-in-progress governs only the RUNNING one. So three
# quick pushes to main would leave the first running, the second pending, and the
# third replacing the second — and the middle commit would carry no evidence at
# all. Exactly the gap the paragraph above forbids, created by the mechanism meant
# to prevent it.
#
# A group keyed by the COMMIT makes every main run alone in its group, so there is
# never another run to cancel or be cancelled by. Pull request refs keep sharing a
# group, which is what makes a superseded run stop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # A LITERAL name. A matrix expression here expands at runtime and can never be
    # bound as a required status check, which is why nextly has jobs called
    # "Scaffold smoke (${{ matrix.os }})" that no ruleset can reference.
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          # 24 is a floor, not a preference: node:sqlite still emits an
          # ExperimentalWarning on 22.x, and the state layer is the authority.
          node-version: '24'
      - name: Assert the Node floor
        run: node -e 'const [m]=process.versions.node.split(".").map(Number); if(m<24){console.error("node "+process.versions.node+" is below the 24 floor"); process.exit(1)} console.log("node",process.versions.node)'
      # TZ stated rather than inherited. The pair of runs below exists to catch
      # offset bugs, and the first one was relying on the runner HAPPENING to be
      # UTC — an ambient property of the hosted image, not a property of this
      # workflow. A self-hosted or differently-configured runner would have run
      # the same suite twice in one zone while still reporting two zones covered.
      - name: Run the suite
        env:
          TZ: UTC
        run: |
          set -euo pipefail
          fail=0
          for f in test/*.test.mjs; do
            echo "── $f"
            node "$f" || fail=1
          done
          exit $fail

      # The runner is UTC, where a timestamp parsed without its trailing Z is
      # accidentally correct. A test that only ever runs in UTC therefore cannot
      # see an entire class of offset bug — and the first version of this suite
      # had one in the opposite direction, asserting the author's +05:00 offset.
      - name: Run the suite again in a non-UTC timezone
        env:
          TZ: Asia/Karachi
        run: |
          set -euo pipefail
          fail=0
          for f in test/*.test.mjs; do node "$f" >/dev/null || { echo "FAILED under TZ=$TZ: $f"; fail=1; }; done
          exit $fail

  sweep:
    # Does the suite actually TEST what it claims to?
    #
    # A separate job from `test` on purpose. A green suite and a suite that could
    # never go red look identical, and folding this into the same job would let one
    # explain the other's failure. Kept apart, "the tests pass" and "the tests can
    # fail" are two answers.
    #
    # This exists because three assertions in one pull request proved a mechanism
    # existed without proving it was REACHED — a count where both readings were
    # zero, a bound whose caller never passed one, and a guard whose fixture
    # filtered the row out before the guarded line ran. All three were green,
    # plausible, and worthless, and all three were caught by hand. A verification
    # step that depends on someone remembering is the fallible read.
    name: Stub sweep
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`, and the sweep FAILS without it rather than passing.
      #
      # The default is a single commit: no history, no default branch, no merge base.
      # The sweep refuses to grandfather a test file you are editing, and to know
      # which files those are it needs a diff -- and a diff against a base that
      # cannot be resolved does not error. It yields NOTHING. An empty change set
      # intersects an empty grandfather list and the check passes: green, fast, and
      # measuring nothing, which is the precise failure the sweep exists to catch,
      # arriving through the checkout configuration rather than through the logic.
      #
      # So the refusal is deliberate and it names this line, because the symptom
      # otherwise is a red gate over a diff that looks perfectly clean.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
      # The sweep refuses a dirty tree, so this asserts the precondition rather
      # than discovering it as a confusing refusal further down.
      - name: The checkout must be clean
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then echo "::error::the checkout is not clean"; echo "$dirty"; exit 1; fi
      - name: Break the code on purpose and check the tests notice
        env:
          TZ: UTC
          # THE BASE TO DIFF AGAINST, and it differs by event for a reason.
          #
          # On a pull request the base branch's tip is the right comparison. On a PUSH
          # to the default branch the checkout puts HEAD and origin/main at the same
          # commit, so a merge base against origin/main IS HEAD, the change set comes
          # out empty, and the grandfathering gate passes without looking at anything.
          # A direct commit to main could then edit a grandfathered test, or add a new
          # test straight to the list, unopposed.
          #
          # `github.event.before` is the commit the branch was at, which is the diff a
          # person would draw by hand. The sweep refuses outright if the base still
          # resolves to HEAD, so this value being wrong fails loudly rather than
          # silently disabling the gate.
          STUB_SWEEP_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/stub-sweep.mjs

  gate:
    # The aggregate. `if: always()` plus an explicit failure check is what makes a
    # skipped or cancelled dependency block rather than silently pass: a needs:
    # clause alone treats "skipped" as success.
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [test, sweep]
    if: always()
    steps:
      - name: Refuse anything that is not a success
        run: |
          echo "test:  ${{ needs.test.result }}"
          echo "sweep: ${{ needs.sweep.result }}"
          fail=0
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::CI Gate refuses: test concluded '${{ needs.test.result }}'"
            fail=1
          fi
          # The sweep is REQUIRED, not advisory. An advisory line saying the tests
          # cannot fail is a line someone eventually stops reading, which is how
          # this class of defect survived three times in one pull request.
          if [ "${{ needs.sweep.result }}" != "success" ]; then
            echo "::error::CI Gate refuses: stub sweep concluded '${{ needs.sweep.result }}'"
            fail=1
          fi
          exit $fail
